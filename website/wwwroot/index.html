<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DaisyBlazor — daisyUI components for Blazor</title>
    <meta name="description" content="A Tailwind CSS v4 + daisyUI v5 component library for Blazor: 60+ components, a MudBlazor-compatible API, 37 live themes and dependency-free charts." />
    <base href="/" />
    <script src="_content/DaisyBlazor.Components/theme-init.js" data-light="daisyblazor" data-dark="daisyblazor-dark"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
</head>
<body>
    <div id="app">
        <div class="boot" aria-live="polite">
            <svg width="72" height="72" viewBox="0 0 64 64" aria-hidden="true"><use href="favicon.svg#mark" /></svg>
        </div>
    </div>
    <div id="blazor-error-ui" class="alert alert-error shadow-lg">
        Something went wrong while running the docs.
        <a href="." class="btn btn-sm">Reload</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
