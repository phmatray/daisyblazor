<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DaisyBlazor: daisyUI components and charts for Blazor</title>
    <meta id="shell-description" name="description" content="Open-source daisyUI v5 and Tailwind CSS v4 components for Blazor, with 54 theme-aware SVG chart types laid out by D3, a MudBlazor-compatible API and 37 themes." />
    <base href="/" />
    <script src="js/theme-param.js"></script>
    <script src="_content/DaisyBlazor.Components/theme-init.js" data-light="daisyblazor" data-dark="daisyblazor-dark"
            data-themes="daisyblazor daisyblazor-dark light dark cupcake bumblebee emerald corporate synthwave retro cyberpunk valentine halloween garden forest aqua lofi pastel fantasy wireframe black luxury dracula cmyk autumn business acid lemonade night coffee winter dim nord sunset caramellatte abyss silk"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="DaisyBlazor.Docs.styles.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
</head>
<body>
    <div id="app">
        <div class="boot" aria-live="polite">
            <svg width="72" height="72" viewBox="0 0 64 64" aria-hidden="true"><use href="favicon.svg#mark" /></svg>
        </div>
    </div>
    <div id="blazor-error-ui" class="alert alert-error shadow-lg">
        Something went wrong while running the docs.
        <a href="." class="btn btn-sm">Reload</a>
    </div>
    <script>
        // Head tags baked in by the prerender, and the shell's own description, give way to the ones Blazor adds for each page.
        document.querySelectorAll('head [data-prerendered], #shell-description').forEach(el => el.remove());
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
