name: docs

# Publish the Blazor WebAssembly docs site (website/) to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/**'
      - 'Directory.*.props'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel in-progress production deploys.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The project compiles its Tailwind CSS with the NuGet's standalone CLI (no Node needed).
      - name: Publish
        run: dotnet publish website/DaisyBlazor.Docs.csproj -c Release -o publish

      # Serve under /daisyblazor/, let GitHub Pages' 404 boot the SPA for deep links, skip Jekyll.
      - name: Prepare for GitHub Pages
        run: |
          sed -i 's|<base href="/" />|<base href="/daisyblazor/" />|' publish/wwwroot/index.html
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: publish/wwwroot

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
