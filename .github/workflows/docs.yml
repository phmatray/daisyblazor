name: docs

# Publish the Blazor WebAssembly docs site (website/) to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/**'
      - 'Directory.*.props'
      - '.github/workflows/docs.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel in-progress production deploys.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The project compiles its Tailwind CSS with the NuGet's standalone CLI (no Node needed).
      - name: Publish
        run: dotnet publish website/DaisyBlazor.Docs.csproj -c Release -o publish

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Every page becomes static HTML with its own title, description, canonical URL and content
      # (served with a 200 for /charts, /components/barchart…), plus 404.html for the SPA fallback,
      # sitemap.xml and robots.txt; all under /daisyblazor/. Fails on a broken internal link.
      - name: Prerender pages
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node website/scripts/prerender.mjs publish/wwwroot /daisyblazor/
          touch publish/wwwroot/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: publish/wwwroot

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
