name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # scripts/gen-styles.mjs needs Tailwind's scanner and the vendored daisyUI version; the
      # docs site compiles its CSS with the NuGet's standalone Tailwind CLI (no npm). The shipped
      # preset's `@plugin "daisyui"` resolves daisyUI from the repo-root node_modules.
      - name: Install front-end deps
        run: npm install

      # The preset is generated from the component sources; fail if a copy or the safelist is stale.
      - name: Check generated styles
        run: node scripts/gen-styles.mjs --check

      # The D3 bundle shipped in DaisyBlazor.Charts is generated from the pinned npm versions.
      - name: Check the D3 bundle
        run: node scripts/build-d3.mjs --check

      - name: Test static JS
        run: node --test "tests/*.test.mjs"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      # Scaffold the dotnet-new app against the freshly packed packages: NuGet-only CSS build.
      - name: Template smoke test
        run: ./scripts/test-template.sh
